<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>5e Anna</title><meta name="description" content="按法术、生物与物品分别筛选的本地只读速查表">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <script src="/kit.js"></script><script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css"><script src="/link-labels.js"></script><script src="/workspace.js" defer></script><script src="/menu.js" defer></script><script src="/companions.js" defer></script><script src="/detail.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#q" data-ui="skipSearch"></a>
<header class="topbar" data-page="query"><button type="button" id="audit-mode" class="audit-toggle" aria-pressed="false"><span class="audit-switch" aria-hidden="true"></span><span data-ui="auditMode"></span></button></header>
<script src="/topbar.js"></script>
<div class="workspace">
  <main id="query-main">
    <div class="heading-row"><h1 id="title">全部条目</h1><span id="type-total" class="muted"></span><span class="heading-note">自动提取 · 未经全量核验</span></div>
    <form id="search-form" class="toolbar">
      <div class="searchbox condition-bar"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <div id="active-filters" class="active-filters fade-strip" role="group" aria-label="已选条件"></div>
        <input id="q" type="text" role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list" placeholder="搜索名称，或输入类型、学派、来源…" aria-label="搜索名称或添加条件" autocomplete="off" spellcheck="false"><kbd>/</kbd>
        <ul id="suggestions" role="listbox" aria-label="可添加的条件" hidden></ul></div>
      <button type="button" id="toggle-filters" aria-controls="filter-panel" aria-expanded="false">筛选 <span id="filter-count"></span> ▾</button>
      <button type="button" id="reset" class="quiet-button">清空</button>
    </form>
    <section id="filter-panel" aria-label="筛选条件" hidden>
      <div class="filter-hint">未选的组不限制；同组所选取并集，不同组取交集。<span>数字为选中该项后的结果数；“否”不包含未知或冲突。</span></div>
      <div id="type-filters"></div>
      <div id="domain-filters"></div>
      <details id="source-details"><summary>来源与版本 <span id="common-count"></span></summary>
        <div id="common-filters"></div>
        <div class="source-search-row"><input id="source-search" type="search" placeholder="筛选书名 / 缩写" aria-label="筛选来源选项"><span class="muted">只过滤选项；不改变选择</span></div>
        <div id="source-filters"></div>
      </details>
      <details id="audit-details"><summary>分类依据与旧版标记 <span id="audit-count"></span></summary><div id="audit-filters"></div>
        <div class="audit-toggles"><label><input id="conflict" type="checkbox">仅字段冲突</label><label><input id="sections" type="checkbox">包含未分类段落</label><span class="muted">未见标记不代表新版；原文明示不等于已核实。</span></div>
      </details>
    </section>
    <div class="results-bar">
      <span id="result-count" role="status" aria-live="polite">正在查询…</span><button type="button" id="elsewhere" class="quiet-button" aria-controls="filter-panel" hidden></button>
      <div class="result-actions"><label class="sort-control"><span class="sort-label" data-ui="sortLabel"></span><select id="sort" aria-label="排序字段"></select></label><button type="button" id="direction" aria-label="切换排序方向">升序 ↑</button>
        <div class="menu"><button type="button" id="display-toggle" aria-expanded="false" aria-controls="display-panel"><span data-ui="displayOptions"></span><span class="menu-mark" aria-hidden="true"></span> ▾</button>
          <div id="display-panel" class="menu-panel" role="group" aria-labelledby="display-toggle" hidden><label class="check-toggle"><input type="checkbox" id="stack-versions" checked><span data-ui="stackVersions"></span></label><label class="prefer-control"><span data-ui="preferRuleset"></span><select id="prefer"></select></label><label class="check-toggle"><input type="checkbox" id="compact-rows"><span data-ui="compactRows"></span></label></div>
        </div></div>
    </div>
    <div id="error" role="alert" hidden></div>
    <div class="table-wrap" role="region" aria-label="速查结果表，可横向滚动" tabindex="0"><table><thead id="columns"></thead><tbody id="results"></tbody></table><div id="empty" hidden><strong data-ui="emptyTitle"></strong><span data-ui="emptyHint"></span><div id="empty-elsewhere"></div></div><div id="load-more-row" hidden><button type="button" id="load-more"></button><span id="load-error" role="alert" hidden></span></div></div>
    <div class="bottom-bar"><span id="range" role="status" aria-live="polite"></span><span class="legend" data-ui="legend"></span><button type="button" id="export" class="quiet-button" disabled>导出 CSV</button></div>
  </main>
  <dialog id="detail" aria-labelledby="reader-title">
    <div id="reader-resizer" role="separator" aria-orientation="vertical" aria-controls="detail" tabindex="0"></div>
    <div class="detail-top"><span id="reader-title" data-ui="readerTitle"></span><span id="reader-name" aria-hidden="true"></span><div class="detail-tools"><span id="detail-position"></span><button id="entry-prev" data-ui-label="previousEntry" disabled>‹</button><button id="entry-next" data-ui-label="nextEntry" disabled>›</button><button id="reader-full" type="button" class="icon-button" aria-pressed="false" data-ui-label="fullWidth">
      <svg class="full-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg class="full-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button><button id="close-detail" class="icon-button" data-ui-label="closeDetail" aria-keyshortcuts="Escape" autofocus>×</button></div></div>
    <div id="detail-content" tabindex="-1"></div>
  </dialog>
</div>
<noscript>查询页需要 JavaScript；终端也可使用 query.py 查询。</noscript>
</body></html>
