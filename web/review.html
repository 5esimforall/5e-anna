<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5e Anna</title><script src="/theme.js"></script><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/style.css"><script src="/link-labels.js" defer></script><script src="/review-ui.js" defer></script></head>
<body class="review-page"><main class="source-page">
<a href="/" id="review-back"></a><h1 id="review-heading"></h1><p id="review-policy"></p><p id="review-pending" role="status"></p>
<section aria-labelledby="candidate-heading"><h2 id="candidate-heading"></h2>
<form id="candidate-form" class="review-controls"><label><span id="reference-label"></span><input name="reference" required autocomplete="off"></label><label><span id="candidate-query-label"></span><input name="query" maxlength="200" type="search"></label><button id="candidate-submit"></button></form>
<div id="candidate-results" aria-live="polite"></div><nav class="review-controls"><button id="candidate-prev" disabled></button><span id="candidate-count"></span><button id="candidate-next" disabled></button></nav></section>
<section aria-labelledby="missing-heading"><h2 id="missing-heading"></h2><p id="missing-help"></p>
<form id="missing-form" class="review-controls"><label><span id="missing-status-label"></span><select name="status"></select></label><button id="missing-submit"></button></form>
<div id="missing-results" aria-live="polite"></div><nav class="review-controls"><button id="missing-prev" disabled></button><span id="missing-count"></span><button id="missing-next" disabled></button></nav></section>
</main></body></html>
