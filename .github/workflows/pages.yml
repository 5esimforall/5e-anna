name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PAGES_OUTPUT: output/pages
      WEB_DIR: ${{ runner.temp }}/5echm-web
      OUR5ETOOLS_DIR: ${{ runner.temp }}/our5etools
      COUNTERPARTS_DIR: ${{ runner.temp }}/5etools-cn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch the sources pinned in sources.json
        run: |
          lock() { python scripts/sources.py get "$@"; }
          git init "$WEB_DIR"
          git -C "$WEB_DIR" fetch --depth 1 "$(lock web repo)" "$(lock web revision)"
          git -C "$WEB_DIR" checkout --detach FETCH_HEAD
          git init "$OUR5ETOOLS_DIR"
          git -C "$OUR5ETOOLS_DIR" fetch --depth 1 "$(lock our5etools repo)" "$(lock our5etools revision)"
          git -C "$OUR5ETOOLS_DIR" checkout --detach FETCH_HEAD
          test -d "$OUR5ETOOLS_DIR/data"
          test -f "$OUR5ETOOLS_DIR/__api/books.json"
          git clone --depth 1 --filter=blob:none --no-checkout "$(lock counterparts repo)" "$COUNTERPARTS_DIR"
          git -C "$COUNTERPARTS_DIR" sparse-checkout set --cone $(lock counterparts sparse)
          git -C "$COUNTERPARTS_DIR" fetch --depth 1 --filter=blob:none origin "$(lock counterparts revision)"
          git -C "$COUNTERPARTS_DIR" checkout --detach FETCH_HEAD
      - name: Build Anna and Stella
        run: |
          python -m pip install -r requirements.txt
          make build
      - name: Run unit tests against the build
        run: make test-unit
      - name: Package for Pages
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: make pages "PAGES_BASE=${BASE_PATH%/}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PAGES_OUTPUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
