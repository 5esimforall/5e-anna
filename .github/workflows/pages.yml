name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the default library
        env:
          WEB_DIR: ${{ runner.temp }}/5echm-web
          BOOK_REVISION: c1425c8e90804766689a0db7ec416833f3fc3046
        run: |
          git init "$WEB_DIR"
          git -C "$WEB_DIR" fetch --depth 1 https://github.com/DND5eChm/5echm_web.git "$BOOK_REVISION"
          git -C "$WEB_DIR" checkout --detach FETCH_HEAD
          python -m pip install -r requirements.txt
          make icons
          python -m anna.catalog.build --no-counterparts
          make linked
      - name: Package Anna and Stella
        env:
          WEB_DIR: ${{ runner.temp }}/5echm-web
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python -m anna.server.pages_build --base "${BASE_PATH%/}/" --output output/pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
