<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>5e Stella</title>
  <link rel="icon" href="/stella-favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256"><script src="/kit.js"></script><script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/reader.css">
  <script src="/link-labels.js"></script><script src="/reader-labels.js" defer></script><script src="/reader-model.js" defer></script><script src="/reader-flow.js" defer></script><script src="/menu.js" defer></script><script src="/reader.js" defer></script>
</head>
<body class="book-app">
<a class="skip-link" href="#content" data-text="skip"></a>
<header class="topbar book-topbar">
  <a class="brand" href="/read"><img class="brand-logo" src="/stella-logo.png" width="36" height="36" alt="">5e Stella</a>
  <div class="topbar-actions">
    <a class="book-query" href="/" data-text="query"></a>
    <button class="icon-button theme-button" id="theme" type="button" hidden>
    <svg class="theme-icon-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>
    <svg class="theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.4 8.4 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2z"/></svg>
  </button></div>
</header>
<div class="book-workspace">
  <dialog id="book-sidebar" data-label="navigation">
    <div class="book-sidebar-head"><div role="tablist" data-label="navigation">
      <button role="tab" id="tab-contents" aria-controls="panel-contents" aria-selected="true" data-pane="contents" data-text="contents"></button>
      <button role="tab" id="tab-outline" aria-controls="panel-outline" aria-selected="false" tabindex="-1" data-pane="outline" data-text="outline"></button>
      <button role="tab" id="tab-search" aria-controls="panel-search" aria-selected="false" tabindex="-1" data-pane="search" data-text="search"></button>
    </div><button id="book-close" class="book-icon" data-label="closeNavigation">×</button></div>
    <section id="panel-contents" role="tabpanel" aria-labelledby="tab-contents">
      <div class="book-tree-tools">
        <button class="icon-button" id="book-filter-open" type="button" data-label="filter" aria-controls="book-filter" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
        <div class="book-filter"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><input type="search" id="book-filter" data-label="filter" data-placeholder="filterPlaceholder" autocomplete="off"><button id="book-filter-clear" type="button" data-label="clearFilter" hidden>×</button></div>
        <button class="icon-button" id="book-locate" type="button" data-label="locate" aria-describedby="book-follow-status"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></button>
        <button class="icon-button" id="book-expand" type="button" data-label="expandChapter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg></button>
        <button class="icon-button" id="book-collapse" type="button" data-label="collapse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l5 5 5-5M7 20l5-5 5 5"/></svg></button>
      </div>
      <p id="book-follow-status" class="sr-only" role="status"></p>
      <div id="book-tree-scroll"><ul id="book-tree" role="tree" data-label="contents"></ul><p id="book-tree-empty" class="book-note" data-text="emptyTree" hidden></p></div>
    </section>
    <section id="panel-outline" role="tabpanel" aria-labelledby="tab-outline" hidden>
      <p id="book-outline-title"></p><ol id="book-outline"></ol><p id="book-outline-empty" class="book-note" data-text="noOutline"></p>
    </section>
    <section id="panel-search" role="tabpanel" aria-labelledby="tab-search" hidden>
      <form id="book-search-form"><label for="book-search" data-text="searchLabel"></label><div class="book-search-input"><input id="book-search" type="search" data-placeholder="searchPlaceholder" required autocomplete="off"><button data-text="searchSubmit"></button></div><label class="book-checkbox"><input id="book-title-only" type="checkbox"><span data-text="titleOnly"></span></label></form>
      <p class="book-note" data-text="searchHint"></p><a id="book-query-search" href="/" data-text="searchEntries"></a>
      <p id="book-search-status" role="status"></p><p id="book-search-fallback" class="book-note" data-text="anyMatch" hidden></p>
      <ol id="book-search-results"></ol>
      <div id="book-search-paging" hidden><button id="book-search-prev" data-label="previousResults">‹</button><span id="book-search-page"></span><button id="book-search-next" data-label="nextResults">›</button></div>
    </section>
    <div class="book-sidebar-foot"><span id="book-version" hidden></span><p data-text="keyboard"></p></div>
  </dialog>
  <main id="book-main" data-label="original">
      <div id="book-bar">
        <button class="icon-button" id="book-menu" type="button" aria-controls="book-sidebar" aria-expanded="false" data-label="openNavigation"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15"/></svg></button>
        <nav id="book-breadcrumb" data-label="location"><ol id="book-path"></ol></nav>
        <div id="book-path-menu" role="menu" tabindex="-1" hidden></div>
        <nav id="book-paging" data-label="scopeNavigation" hidden><div class="book-sequence">
          <a id="book-previous" data-label="previous" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
          <span id="book-page-count"></span>
          <a id="book-next" data-label="next" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
        </div></nav>
      </div>
      <div id="book-loading" role="status" data-text="loading"></div>
      <div id="book-error" role="alert" hidden><p id="book-error-text"></p><button id="book-retry" data-text="retry"></button><a href="/read" data-text="home"></a></div>
      <div id="book-scroll" tabindex="-1"><div id="book-pages"></div></div>
      <p id="book-status" role="status" hidden></p>
  </main>
</div>
<noscript>阅读器需要 JavaScript。原文镜像保持只读，请使用 make up 启动阅读服务。</noscript>
</body></html>
